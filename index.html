<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recettes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#E7D9C8">
<title>Mes Recettes</title>
<style>
/* ============ TOKENS — palette « Mediterranean Calm » ============
   Terracotta Glow #C28B6A · Sunwashed Linen #E7D9C8 · Warm Sand #DCC8B2
   Olive Mist #B6B49C · Sage Garden #98A084 · Deep Olive #667055
   Thème clair unique, pensé pour la lisibilité en extérieur.
   Contrastes WCAG AA : texte blanc uniquement sur Deep Olive (5,2:1) et terracotta foncé (5,3:1). */
:root {
  --linen: #E7D9C8;
  --sand: #DCC8B2;
  --clay: #C28B6A;
  --olive-mist: #B6B49C;
  --sage: #98A084;
  --olive: #667055;

  --bg: var(--linen);            /* fond de page */
  --surface: #F7F1E9;            /* cartes, champs (linen éclairci) */
  --soft: var(--sand);           /* boutons secondaires, puces */
  --soft-press: #CDB79E;
  --text: #2E2A24;               /* brun olive très foncé : 10,3:1 sur linen */
  --muted: #5E564B;              /* 5,2:1 sur linen */
  --line: #D2C1AB;

  --accent: var(--olive);        /* actions principales */
  --accent-press: #525A43;
  --clay-deep: #9C5B3A;          /* sélection, suppression, pastilles numérotées */
  --clay-tint: #EFDDD0;
  --clay-ink: #7A4A2F;           /* texte terracotta lisible : 5,3:1 */
  --olive-tint: #E3E3D3;
  --olive-ink: #4A5240;
  --success: var(--olive);
  --shop: var(--olive);
  --shop-press: #525A43;

  --backdrop: rgba(46, 42, 36, 0.5);
  --shadow: 0 1px 3px rgba(46, 42, 36, 0.12);
  --radius: 16px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --serif: ui-serif, 'New York', 'Iowan Old Style', Georgia, 'Noto Serif', 'Times New Roman', serif;
  color-scheme: light;
}

/* ============ BASE ============ */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html {
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;          /* pas de zoom au double-tap */
  overscroll-behavior-y: none;         /* pas de pull-to-refresh accidentel */
}
html.is-locked, html.is-locked body { overflow: hidden; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
img { display: block; max-width: 100%; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Boutons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 16px; border-radius: 14px;
  font-weight: 700; font-size: 16px; text-decoration: none;
  transition: background-color .15s ease, transform .15s ease;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:active { background: var(--accent-press); }
.btn-soft { background: var(--soft); color: var(--text); }
.btn-soft:active { background: var(--soft-press); }
.btn-danger { background: var(--clay-tint); color: var(--clay-ink); }
.btn-danger:active { background: var(--soft-press); }
.icon-btn {
  position: relative; display: grid; place-items: center; flex-shrink: 0;
  width: 48px; height: 48px; border-radius: 50%; font-size: 22px;
}
.icon-btn:active { background: var(--soft-press); }

/* ============ HEADER STICKY (56px) ============ */
.appbar {
  position: sticky; top: 0; z-index: 20;
  padding: var(--safe-t) calc(8px + var(--safe-r)) 0 calc(16px + var(--safe-l));
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.bar { display: flex; align-items: center; gap: 8px; height: 56px; }
.bar h1 { flex: 1; min-width: 0; margin: 0; font-family: var(--serif); font-size: 22px; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-search { padding-right: 8px; }
.bar-search input {
  flex: 1; min-width: 0; height: 48px; padding: 0 16px;
  border: 2px solid var(--accent); border-radius: 12px; background: var(--surface);
  font-size: 16px; -webkit-appearance: none; appearance: none;
}
.bar-search input::-webkit-search-cancel-button { display: none; }
.text-btn { min-height: 48px; min-width: 48px; padding: 0 8px; font-weight: 700; color: var(--clay-ink); }
.count-badge {
  position: absolute; top: 0; right: 0; min-width: 24px; height: 24px; padding: 0 6px;
  border-radius: 10px; background: var(--clay-deep); color: #fff;
  font-size: 16px; font-weight: 700; line-height: 24px; text-align: center;
}

/* ============ CONTENU ============ */
main { padding: 16px calc(16px + var(--safe-r)) calc(120px + var(--safe-b)) calc(16px + var(--safe-l)); }

/* Barre des saisons : 4 boutons, re-toucher la saison active = toutes saisons */
.seasons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.season-btn {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 56px; padding: 0 12px; border-radius: 14px; background: var(--soft);
  font-size: 16px; font-weight: 700; line-height: 1.2;
}
.season-btn .emo { font-size: 22px; line-height: 1; }
.season-btn:active { background: var(--soft-press); }
.season-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }
.now-dot { position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--clay); box-shadow: 0 0 0 2px var(--soft); }
.season-btn[aria-pressed="true"] .now-dot { box-shadow: 0 0 0 2px var(--accent); }

.summary { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
.summary .count { margin: 0 8px 0 0; color: var(--muted); font-size: 16px; font-weight: 600; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 16px;
  border-radius: 22px; background: var(--clay-tint); color: var(--clay-ink); font-size: 16px; font-weight: 700;
}
.pill:active { background: var(--soft-press); }

/* ============ GRILLE 2 COLONNES (répartition équilibrée en JS) ============ */
.grid { display: flex; align-items: flex-start; gap: 12px; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.card {
  position: relative; border-radius: var(--radius); overflow: hidden;
  background: transparent; box-shadow: var(--shadow);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.swipe-hint {
  position: absolute; inset: 0; display: none; background: var(--clay-deep); align-items: center; justify-content: flex-end;
  padding-right: 16px; color: #fff; font-weight: 800; font-size: 16px;
}
.card-inner {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  touch-action: pan-y;                  /* scroll vertical natif, geste horizontal pour nous */
  transition: transform .25s ease;
}
.card.is-swiping .card-inner { transition: none; }
.card.is-swiping .swipe-hint, .card.is-removing .swipe-hint { display: flex; }
.card.is-armed .swipe-hint { font-size: 16px; }
.card-inner:active { background: var(--soft); }
.media { position: relative; overflow: hidden; background: var(--tint, var(--soft)); border-radius: 15px 15px 0 0; }
.media img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; opacity: 0; transition: opacity .25s ease; }
.media.is-loaded img { opacity: 1; }
.media:not(.is-loaded)::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
.ph { display: grid; place-items: center; width: 100%; font-size: 44px; }
.card-body { padding: 12px 16px 16px; }
.card-title { margin: 0 0 8px; font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 16px; color: var(--muted); }
.time { font-variant-numeric: tabular-nums; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; min-height: 30px; padding: 0 10px; border-radius: 15px; background: var(--soft); color: var(--text); font-size: 16px; font-weight: 700; white-space: nowrap; }
.badge[data-cat="Quick"] { background: var(--olive-mist); color: var(--text); }
.badge[data-cat="Dessert"] { background: var(--clay-tint); color: var(--clay-ink); }

/* Skeleton de chargement */
.skeleton .card-inner { pointer-events: none; }
.sk-line { height: 16px; border-radius: 8px; background: var(--soft); margin-bottom: 8px; }
.sk-line.short { width: 60%; margin-bottom: 0; }

/* ============ EMPTY STATE ============ */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 32px 16px; }
.empty-illu { position: relative; display: grid; place-items: center; width: 160px; height: 160px; margin-bottom: 24px; border-radius: 50%; background: var(--soft); font-size: 72px; }
.empty-illu span { position: absolute; font-size: 32px; }
.empty-illu span:nth-child(1) { top: 8px; right: 8px; }
.empty-illu span:nth-child(2) { bottom: 12px; left: 4px; }
.empty h2 { margin: 0 0 8px; font-family: var(--serif); font-size: 22px; font-weight: 600; }
.empty p { margin: 0 0 24px; color: var(--muted); max-width: 32ch; }

/* ============ BOUTON + (pouce) ============ */
.fab {
  position: fixed; z-index: 30;
  right: calc(20px + var(--safe-r)); bottom: calc(20px + var(--safe-b));
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--accent); color: #fff; font-size: 36px; font-weight: 300; line-height: 1;
  box-shadow: 0 4px 14px rgba(82, 90, 67, .4);
  transition: transform .15s ease, background-color .15s ease;
}
.fab:active { transform: scale(0.92); background: var(--accent-press); }

/* ============ ÉCRANS PLEIN ÉCRAN ============ */
.sheet {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column;
  background: var(--bg);
  transform: translateY(100%);
  transition: transform .28s cubic-bezier(.2, .8, .2, 1);
  will-change: transform;
}
.sheet.is-open { transform: none; }
.sheet-head {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  padding: var(--safe-t) calc(8px + var(--safe-r)) 0 calc(8px + var(--safe-l));
  min-height: calc(56px + var(--safe-t));
  border-bottom: 1px solid var(--line);
}
.sheet-head h2 { flex: 1; margin: 0; font-family: var(--serif); font-size: 20px; font-weight: 600; text-align: center; }
.head-spacer { width: 48px; flex-shrink: 0; }
.sheet-scroll {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 16px calc(16px + var(--safe-r)) 24px calc(16px + var(--safe-l));
}
.sheet-bar {
  display: grid; gap: 8px; flex-shrink: 0;
  padding: 12px calc(16px + var(--safe-r)) calc(12px + var(--safe-b)) calc(16px + var(--safe-l));
  border-top: 1px solid var(--line); background: var(--bg);
}
.bar-2 { grid-template-columns: 1fr 2fr; }
.bar-3 { grid-template-columns: repeat(3, 1fr); }
.bar-3 .btn { flex-direction: column; gap: 0; min-height: 60px; padding: 4px; font-size: 16px; line-height: 1.3; }
.bar-3 .btn .emo { font-size: 20px; }

/* Détail */
.detail-scroll { padding: 0 0 24px; }
.hero-wrap { position: relative; }
.hero { position: relative; aspect-ratio: 4 / 5; max-height: 56vh; width: 100%; background: var(--tint, var(--soft)); }
.hero img, .hero .ph { width: 100%; height: 100%; object-fit: contain; }
.hero .ph { font-size: 96px; }
.hero-close {
  position: absolute; top: calc(8px + var(--safe-t)); left: calc(12px + var(--safe-l));
  background: rgba(247, 241, 233, .95); color: var(--text); box-shadow: 0 2px 8px rgba(46, 42, 36, .2);
}
.detail-content { padding: 24px calc(16px + var(--safe-r)) 0 calc(16px + var(--safe-l)); }
.detail-content h2 { margin: 0 0 12px; font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.detail-content .meta { font-size: 17px; gap: 8px 16px; margin-bottom: 8px; }
.detail-seasons { margin: 0 0 24px; color: var(--muted); font-weight: 600; }
.section { margin-bottom: 32px; }
.section h3 { margin: 0 0 8px; font-size: 16px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--clay-ink); }
.ing-list { list-style: none; margin: 0; padding: 0; }
.ing { display: flex; align-items: center; gap: 16px; min-height: 52px; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.ing input { width: 24px; height: 24px; margin: 0; flex-shrink: 0; accent-color: var(--olive-ink); }
.ing input:checked + span { color: var(--muted); text-decoration: line-through; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { position: relative; counter-increment: s; padding: 8px 0 16px 48px; line-height: 1.6; }
.steps li::before {
  content: counter(s); position: absolute; left: 0; top: 6px;
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: var(--clay-deep); color: #fff; font-weight: 800; font-size: 16px;
}
.muted-note { margin: 0; color: var(--muted); font-style: italic; }
.source-link { width: 100%; }

/* Formulaire */
.form { display: grid; gap: 24px; }
.field { display: grid; gap: 8px; min-width: 0; border: 0; margin: 0; padding: 0; }
.field > label, .field legend { padding: 0; font-weight: 700; }
.hint { font-weight: 400; color: var(--muted); }
.input {
  width: 100%; min-height: 48px; padding: 12px 16px;
  border: 2px solid var(--line); border-radius: 12px; background: var(--surface);
  font-size: 16px; -webkit-appearance: none; appearance: none;
}
textarea.input { min-height: 144px; resize: vertical; line-height: 1.5; }
.input:focus { border-color: var(--accent); }
.field.is-invalid .input { border-color: var(--accent); background: var(--clay-tint); }
.error { margin: 0; color: var(--clay-ink); font-weight: 700; }
.field-status { margin: 0; font-size: 16px; color: var(--muted); }
.field-status.is-error { color: var(--clay-ink); font-weight: 600; }
.field-status.is-ok { color: var(--olive-ink); font-weight: 600; }
.photo-row { display: flex; gap: 12px; align-items: flex-start; }
.photo-row .input { flex: 1; min-width: 0; }
.photo-preview { width: 64px; aspect-ratio: 4 / 5; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: var(--soft); display: grid; place-items: center; font-size: 24px; }
.photo-preview img { width: 100%; height: 100%; object-fit: cover; }
.options { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.opt span {
  display: inline-flex; align-items: center; min-height: 48px; padding: 0 16px;
  border: 2px solid var(--line); border-radius: 24px; background: var(--surface); font-weight: 600;
}
.opt input:checked + span { border-color: var(--accent); background: var(--accent); color: #fff; }
.opt.season input:checked + span { border-color: var(--olive-ink); background: var(--olive-tint); color: var(--olive-ink); }
.opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.stepper { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center; }
.stepper .input { text-align: center; padding: 12px 4px; }
.stepper button { height: 48px; border-radius: 12px; background: var(--soft); font-size: 22px; font-weight: 700; }
.stepper button:active { background: var(--soft-press); }
.filter-count { margin: 0; font-weight: 600; color: var(--muted); }

/* ============ ACTION SHEET (menu appui long + confirmations) ============ */
.action-layer { position: fixed; inset: 0; z-index: 60; }
.action-backdrop { position: absolute; inset: 0; background: var(--backdrop); opacity: 0; transition: opacity .2s ease; }
.action-panel {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 12px;
  padding: calc(24px + var(--safe-t)) calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l));
  background: var(--bg); overflow-y: auto;
  transform: translateY(100%); transition: transform .25s cubic-bezier(.2, .8, .2, 1);
}
.action-layer.is-open .action-backdrop { opacity: 1; }
.action-layer.is-open .action-panel { transform: none; }
.action-group { border-radius: 16px; overflow: hidden; background: var(--surface); }
.action-head { padding: 24px 16px; text-align: center; border-bottom: 1px solid var(--line); }
.action-head p { margin: 0; }
.action-title { font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.action-msg { color: var(--muted); margin-top: 4px !important; }
.action-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 64px; padding: 0 16px; background: var(--surface);
  font-size: 18px; font-weight: 600; color: var(--text);
}
.action-group .action-btn + .action-btn { border-top: 1px solid var(--line); }
.action-btn.is-danger { color: var(--clay-ink); }
.action-btn:active { background: var(--soft-press); }
.action-cancel { border-radius: 16px; font-weight: 800; }

/* ============ TOASTS (bas d'écran) ============ */
.toasts {
  position: fixed; z-index: 70; left: calc(16px + var(--safe-l)); right: calc(16px + var(--safe-r));
  bottom: calc(96px + var(--safe-b));
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 12px; width: 100%; max-width: 420px;
  min-height: 52px; padding: 4px 8px 4px 16px; border-radius: 14px;
  color: #fff; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25);
  pointer-events: auto; animation: toast-in .2s ease;
}
.toast span { flex: 1; padding: 8px 0; }
.toast.success { background: var(--success); }
.toast.error { background: var(--clay-deep); }
.toast button { min-height: 48px; min-width: 48px; padding: 0 12px; border-radius: 10px; color: #fff; font-weight: 800; text-decoration: underline; }
.toast button:active { background: rgba(255,255,255,.2); }
.toast.is-leaving { opacity: 0; transition: opacity .2s ease; }
@keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* ============ SÉLECTION DES RECETTES ============ */
.select-btn {
  position: absolute; top: 0; left: 0; z-index: 3; transition: opacity .15s ease;
  width: 56px; height: 56px; display: grid; place-items: center;
}
.select-btn .circle {
  display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
  background: rgba(247, 241, 233, .95); border: 2px solid var(--muted); box-shadow: 0 1px 3px rgba(46, 42, 36, .25);
  color: #fff; font-size: 16px; font-weight: 900; line-height: 1;
}
.select-btn .tick { opacity: 0; transform: scale(.4); transition: opacity .18s ease, transform .18s cubic-bezier(.3,1.6,.5,1); }
.card.is-selected .select-btn .circle { background: var(--clay-deep); border-color: var(--clay-deep); }
.card.is-selected .select-btn .tick { opacity: 1; transform: scale(1); }
.select-btn:active .circle { transform: scale(.9); }
.card.is-swiping .select-btn, .card.is-removing .select-btn { opacity: 0; pointer-events: none; }
.card-inner::after {
  content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  border-radius: var(--radius); border: 3px solid transparent; transition: border-color .15s ease, background-color .15s ease;
}
.card.is-selected .card-inner::after { border-color: var(--clay); background: rgba(194, 139, 106, .14); }
.title-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.title-wrap h1 { flex: none; line-height: 1.2; }
.sel-count { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; font-size: 16px; font-weight: 700; color: var(--clay-ink); line-height: 1.3; }

/* ============ BARRE « LISTE DE COURSES » (bas d'écran) ============ */
.cart-bar {
  position: fixed; z-index: 25; left: 0; right: 0; bottom: 0;
  padding: 8px calc(12px + var(--safe-r)) calc(8px + var(--safe-b)) calc(12px + var(--safe-l));
  background: var(--bg); border-top: 1px solid var(--line);
}
.cart-open {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 16px;
  border-radius: 16px; background: var(--shop); color: #fff; text-align: left;
}
.cart-open:active { background: var(--shop-press); }
.cart-open .cart-emo { font-size: 26px; }
.cart-open .cart-txt { flex: 1; min-width: 0; white-space: nowrap; display: flex; flex-direction: column; line-height: 1.3; }
.cart-open strong { font-size: 17px; }
.cart-open #cart-sub { font-size: 16px; opacity: .95; }
.cart-open .cart-go { font-weight: 800; }
html.has-cart main { padding-bottom: calc(200px + var(--safe-b)); }
html.has-cart .fab { bottom: calc(96px + var(--safe-b)); }
html.has-cart .toasts { bottom: calc(172px + var(--safe-b)); }

/* ============ ÉCRAN LISTE DE COURSES ============ */
.shop-head { background: var(--shop); color: #fff; border-bottom: 0; }
.shop-head .icon-btn:active { background: var(--shop-press); }
.shop-head .head-title { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
.shop-head h2 { flex: none; font-size: 20px; }
.shop-badge { margin-top: 2px; padding: 0 10px; border-radius: 12px; background: rgba(255,255,255,.2); font-size: 16px; font-weight: 700; }
.shop-count { min-width: 48px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.shop-recipes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.shop-recipe small { font-size: 16px; font-weight: 600; opacity: .85; }
.shop-progress-bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.shop-progress-bar span { display: block; height: 100%; background: var(--sage); transition: width .25s ease; }
.shop-hint { margin: 8px 0 8px; font-size: 16px; color: var(--muted); }
.shop-list { list-style: none; margin: 0 -16px; padding: 0; }
.shop-row {
  position: relative; background: var(--bg); border-bottom: 1px solid var(--line);
  touch-action: pan-y; transition: transform .2s ease, background-color .2s ease;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.shop-row.is-swiping { transition: none; background: var(--olive-tint); }
.shop-row.is-armed { background: var(--sage); color: var(--text); }
.shop-item { display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 12px 16px; cursor: pointer; }
.shop-item input { width: 24px; height: 24px; margin: 0; flex-shrink: 0; accent-color: var(--shop); }
.shop-text { display: flex; flex-direction: column; min-width: 0; }
.shop-name { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.shop-from { font-size: 16px; color: var(--muted); }
.shop-row.is-bought .shop-text { opacity: .5; }
.shop-row.is-bought .shop-name { text-decoration: line-through; }
.shop-restore { width: 100%; margin-top: 16px; }
.bar-shop { grid-template-columns: 1fr 1fr 1fr; }
.bar-shop .btn { flex-direction: column; gap: 0; min-height: 60px; padding: 4px; font-size: 16px; line-height: 1.3; }
.bar-shop .btn .emo { font-size: 20px; }
.btn-shop { background: var(--shop); color: #fff; }
.btn-shop:active { background: var(--shop-press); }
.detail-shop { width: 100%; margin-bottom: 24px; }
.detail-shop[aria-pressed="true"] { background: var(--olive-tint); color: var(--olive-ink); }

/* Tablette (rare) : on garde 2 colonnes, on centre simplement le contenu */
@media (min-width: 700px) {
  main, .appbar .bar { max-width: 680px; margin-left: auto; margin-right: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>
</head>
<body>

<div id="app">
  <!-- Header sticky -->
  <header class="appbar">
    <div class="bar" id="bar-main">
      <div class="title-wrap">
        <h1>🍳 Mes Recettes</h1>
        <p class="sel-count" id="sel-count" aria-live="polite" hidden></p>
      </div>
      <button class="icon-btn" id="btn-search" type="button" aria-label="Rechercher">🔍</button>
      <button class="icon-btn" id="btn-filters" type="button" aria-label="Filtres">⚙️<span class="count-badge" id="filter-badge" hidden></span></button>
      <button class="icon-btn" id="btn-more" type="button" aria-label="Plus d’options">⋯</button>
    </div>
    <div class="bar bar-search" id="bar-search" role="search" hidden>
      <label for="search-input" class="sr-only">Rechercher une recette ou un ingrédient</label>
      <input id="search-input" type="search" placeholder="Recette, ingrédient…" autocomplete="off" autocorrect="off" enterkeyhint="search">
      <button class="text-btn" id="search-cancel" type="button">Annuler</button>
    </div>
  </header>

  <main>
    <nav class="seasons" id="season-bar" aria-label="Filtrer par saison"></nav>
    <div class="summary" id="summary" aria-live="polite"></div>

    <!-- Skeleton affiché le temps du premier rendu -->
    <div class="grid" id="grid" aria-busy="true">
      <div class="col">
        <div class="card skeleton" aria-hidden="true"><div class="card-inner"><div class="media" style="aspect-ratio:4/5"></div><div class="card-body"><div class="sk-line"></div><div class="sk-line short"></div></div></div></div>
        <div class="card skeleton" aria-hidden="true"><div class="card-inner"><div class="media" style="aspect-ratio:3/4"></div><div class="card-body"><div class="sk-line"></div><div class="sk-line short"></div></div></div></div>
      </div>
      <div class="col">
        <div class="card skeleton" aria-hidden="true"><div class="card-inner"><div class="media" style="aspect-ratio:3/4"></div><div class="card-body"><div class="sk-line"></div><div class="sk-line short"></div></div></div></div>
        <div class="card skeleton" aria-hidden="true"><div class="card-inner"><div class="media" style="aspect-ratio:4/5"></div><div class="card-body"><div class="sk-line"></div><div class="sk-line short"></div></div></div></div>
      </div>
    </div>
    <div class="empty" id="empty" hidden></div>
  </main>

  <button class="fab" id="fab" type="button" aria-label="Ajouter une recette">+</button>

  <!-- Barre qui apparaît dès qu'une recette est sélectionnée -->
  <div class="cart-bar" id="cart-bar" hidden>
    <button class="cart-open" id="cart-open" type="button">
      <span class="cart-emo" aria-hidden="true">🛒</span>
      <span class="cart-txt"><strong>Liste de courses</strong><span id="cart-sub"></span></span>
      <span class="cart-go" aria-hidden="true">Voir ›</span>
    </button>
  </div>
</div>

<!-- ============ LISTE DE COURSES (plein écran, scroll indépendant) ============ -->
<section class="sheet" id="shop-sheet" role="dialog" aria-modal="true" aria-labelledby="shop-title" hidden>
  <div class="sheet-head shop-head">
    <button class="icon-btn" type="button" data-close aria-label="Fermer la liste">⌄</button>
    <div class="head-title">
      <h2 id="shop-title" tabindex="-1">🛒 Liste de courses</h2>
      <span class="shop-badge">Pour 2 personnes</span>
    </div>
    <button class="icon-btn" type="button" id="shop-copy-top" aria-label="Copier la liste">📋</button>
  </div>
  <div class="sheet-scroll" id="shop-body"></div>
  <div class="sheet-bar bar-shop">
    <button class="btn btn-soft" type="button" id="shop-reset"><span class="emo" aria-hidden="true">↺</span>Décocher</button>
    <button class="btn btn-danger" type="button" id="shop-clear"><span class="emo" aria-hidden="true">✕</span>Vider</button>
    <button class="btn btn-shop" type="button" id="shop-copy"><span class="emo" aria-hidden="true">📋</span>Copier</button>
  </div>
  <p class="sr-only" id="shop-progress" aria-live="polite"></p>
</section>

<!-- ============ DÉTAIL (plein écran) ============ -->
<section class="sheet" id="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
  <div class="sheet-scroll detail-scroll" id="detail-body"></div>
  <div class="sheet-bar bar-3">
    <button class="btn btn-soft" type="button" id="detail-edit"><span class="emo" aria-hidden="true">✏️</span>Modifier</button>
    <button class="btn btn-danger" type="button" id="detail-delete"><span class="emo" aria-hidden="true">🗑️</span>Supprimer</button>
    <button class="btn btn-primary" type="button" data-close><span class="emo" aria-hidden="true">✓</span>Fermer</button>
  </div>
</section>

<!-- ============ AJOUT / ÉDITION (plein écran) ============ -->
<section class="sheet" id="form-sheet" role="dialog" aria-modal="true" aria-labelledby="form-title" hidden>
  <div class="sheet-head">
    <button class="icon-btn" type="button" data-close aria-label="Fermer sans enregistrer">✕</button>
    <h2 id="form-title" tabindex="-1">Nouvelle recette</h2>
    <span class="head-spacer"></span>
  </div>
  <form class="sheet-scroll form" id="recipe-form" novalidate>
    <div class="field" id="field-title">
      <label for="f-title">Titre <span class="hint">(obligatoire)</span></label>
      <input class="input" id="f-title" type="text" maxlength="120" autocomplete="off" enterkeyhint="next" placeholder="Ex. Tarte aux pommes" aria-describedby="title-error">
      <p class="error" id="title-error" role="alert" hidden>Donnez un titre à votre recette.</p>
    </div>

    <div class="field">
      <label for="f-image">Photo <span class="hint">(lien, optionnel)</span></label>
      <div class="photo-row">
        <input class="input" id="f-image" type="url" inputmode="url" autocomplete="off" autocapitalize="off" placeholder="https://…/photo.jpg" aria-describedby="photo-status">
        <div class="photo-preview" id="photo-preview" aria-hidden="true">🖼️</div>
      </div>
      <p class="field-status" id="photo-status" aria-live="polite">Collez le lien d’une image (.jpg, .png, .webp).</p>
    </div>

    <fieldset class="field">
      <legend>Catégorie</legend>
      <div class="options" id="f-categories"></div>
    </fieldset>

    <div class="row-2">
      <div class="field">
        <label for="f-time">Temps</label>
        <input class="input" id="f-time" type="number" inputmode="numeric" min="0" step="1" placeholder="30">
      </div>
      <fieldset class="field">
        <legend>Unité</legend>
        <div class="options">
          <label class="opt"><input type="radio" name="unit" value="min" checked><span>min</span></label>
          <label class="opt"><input type="radio" name="unit" value="h"><span>h</span></label>
        </div>
      </fieldset>
    </div>

    <div class="field">
      <label for="f-servings">Nombre de portions <span class="hint">(sert au calcul de la liste de courses)</span></label>
      <div class="stepper">
        <button type="button" id="servings-minus" aria-label="Une portion de moins">−</button>
        <input class="input" id="f-servings" type="number" inputmode="numeric" min="1" max="30" step="1" value="2">
        <button type="button" id="servings-plus" aria-label="Une portion de plus">+</button>
      </div>
    </div>

    <fieldset class="field">
      <legend>Saisons <span class="hint">(aucune = toute l’année)</span></legend>
      <div class="options" id="f-seasons"></div>
    </fieldset>

    <div class="field">
      <label for="f-ingredients">Ingrédients <span class="hint">(un par ligne)</span></label>
      <textarea class="input" id="f-ingredients" rows="5" placeholder="200 g de farine&#10;2 œufs&#10;25 cl de lait"></textarea>
    </div>
    <div class="field">
      <label for="f-steps">Étapes <span class="hint">(une par ligne)</span></label>
      <textarea class="input" id="f-steps" rows="5" placeholder="Mélanger la farine et les œufs&#10;Ajouter le lait petit à petit"></textarea>
    </div>
    <div class="field">
      <label for="f-source">Lien de la recette <span class="hint">(optionnel)</span></label>
      <input class="input" id="f-source" type="url" inputmode="url" autocomplete="off" autocapitalize="off" placeholder="https://…">
    </div>
  </form>
  <div class="sheet-bar bar-2">
    <button class="btn btn-soft" type="button" data-close>Annuler</button>
    <button class="btn btn-primary" type="submit" form="recipe-form">Enregistrer</button>
  </div>
</section>

<!-- ============ FILTRES (plein écran) ============ -->
<section class="sheet" id="filter-sheet" role="dialog" aria-modal="true" aria-labelledby="filter-title" hidden>
  <div class="sheet-head">
    <button class="icon-btn" type="button" data-close aria-label="Fermer les filtres">✕</button>
    <h2 id="filter-title" tabindex="-1">Filtres</h2>
    <span class="head-spacer"></span>
  </div>
  <div class="sheet-scroll form">
    <fieldset class="field"><legend>Saison</legend><div class="options" id="flt-seasons"></div></fieldset>
    <fieldset class="field"><legend>Catégorie</legend><div class="options" id="flt-categories"></div></fieldset>
    <fieldset class="field"><legend>Temps maximum</legend><div class="options" id="flt-times"></div></fieldset>
    <p class="filter-count" id="filter-count" aria-live="polite"></p>
  </div>
  <div class="sheet-bar bar-2">
    <button class="btn btn-soft" type="button" id="filter-reset">Réinitialiser</button>
    <button class="btn btn-primary" type="button" data-close id="filter-apply">Voir les recettes</button>
  </div>
</section>

<!-- ============ ACTION SHEET ============ -->
<div class="action-layer" id="action-sheet" hidden>
  <div class="action-backdrop" data-dismiss></div>
  <div class="action-panel" role="dialog" aria-modal="true" aria-labelledby="action-title">
    <div class="action-group">
      <div class="action-head"><p class="action-title" id="action-title" tabindex="-1"></p><p class="action-msg" id="action-msg"></p></div>
      <div id="action-buttons"></div>
    </div>
    <button class="action-btn action-cancel" type="button" data-dismiss>Annuler</button>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

const normalize = (s) => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

function hash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function isValidUrl(v) {
  try { const u = new URL(v); return ['http:', 'https:', 'data:'].includes(u.protocol); } catch (e) { return false; }
}
function formatTime(min) {
  const m = Math.round(Number(min) || 0);
  if (m <= 0) return '—';
  if (m < 60) return `${m} min`;
  return m % 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}` : `${m / 60} h`;
}
function toLines(text) {
  return String(text || '').split(/\r?\n/)
    .map((l) => l.replace(/^\s*(?:\d+\s*[.)-]|[-•*–])\s*/, '').trim())
    .filter(Boolean);
}

function jowKey(url) {

function mediaHTML(r, { className = 'media', ratio = '', eager = false } = {}) {
  const srcs = photoSources(r);
  const style = `--tint:${tint(r)};${ratio ? `aspect-ratio:${ratio};` : ''}`;
  if (!srcs.length) return `<div class="${className} is-loaded" style="${style}">${placeholderHTML(r)}</div>`;
  return `<div class="${className}" style="${style}"><img src="${esc(srcs[0])}" data-next="${esc(srcs.slice(1).join(' '))}" data-emoji="${esc((CATEGORIES[r.category] || CATEGORIES.Plat).emoji)}" alt="" ${eager ? '' : 'loading="lazy"'} decoding="async" draggable="false"></div>`;
}
// load / error ne remontent pas : écoute en phase de capture
document.addEventListener('load', (e) => {
  if (e.target.tagName === 'IMG' && e.target.parentElement) e.target.parentElement.classList.add('is-loaded');
}, true);
document.addEventListener('error', (e) => {
  const img = e.target;
  if (img.tagName !== 'IMG' || !img.parentElement) return;
  const next = (img.dataset.next || '').split(' ').filter(Boolean);
  if (next.length) {
    img.dataset.next = next.slice(1).join(' ');
    img.src = next[0];
    return;
  }
  const box = img.parentElement;
  if (box.id === 'photo-preview') return;
  box.classList.add('is-loaded');
  box.innerHTML = `<div class="ph" aria-hidden="true">${esc(img.dataset.emoji || '🍽️')}</div>`;
}, true);

/* =====================================================================
   STOCKAGE LOCAL
   ===================================================================== */
function sanitize(r) {
  if (!r || typeof r !== 'object' || !String(r.title || '').trim()) return null;
  return {
    id: String(r.id || uid()),
    title: String(r.title).slice(0, 200),
    image: typeof r.image === 'string' ? r.image : '',
    category: CATEGORIES[r.category] ? r.category : 'Plat',
    minutes: Math.max(0, Number(r.minutes) || 0),
    servings: Number(r.servings) > 0 ? Math.round(Number(r.servings)) : null,
    source: typeof r.source === 'string' ? r.source : '',
    seasons: Array.isArray(r.seasons) ? r.seasons.filter((s) => SEASONS[s]) : undefined,
    ingredients: Array.isArray(r.ingredients) ? r.ingredients.map(String) : [],
    steps: Array.isArray(r.steps) ? r.steps.map(String) : [],
    createdAt: Number(r.createdAt) || Date.now()
  };
}
function expandJowRecipes() {
  const now = Date.now();
  return JOW_RECIPES.map(([title, category, minutes, servings, img, slug, ing, steps, seasons], i) => ({
    id: 'jow-' + slug.slice(-8),
    title, category, minutes, servings,
    image: `https://static.jow.fr/480x600/recipes/${img}.png.webp`,
    source: `https://jow.fr/recipes/${slug}`,
    seasons: seasons ? seasons.split('') : [],
    ingredients: ing.split('|'),
    steps: steps.split('|'),
    createdAt: now - i * 1000
  }));
}
function loadRecipes() {
  try {
    let parsed = [];
    try { parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { parsed = []; }
    recipes = (Array.isArray(parsed) ? parsed : []).map(sanitize).filter(Boolean);

    const jow = expandJowRecipes();
    const jowById = new Map(jow.map((r) => [r.id, r]));
    // Recettes Jow enregistrées avant l'ajout des saisons
    recipes.forEach((r) => { if (!r.seasons && jowById.has(r.id)) r.seasons = jowById.get(r.id).seasons; });

    // Import par lots : seules les nouvelles entrées sont ajoutées, sans doublon
    const stored = localStorage.getItem(JOW_IMPORT_KEY);
    const done = stored !== null ? parseInt(stored, 10) || 0 : (localStorage.getItem(JOW_IMPORT_LEGACY_KEY) !== null ? 66 : 0);
    if (done < jow.length) {
      const known = new Set(recipes.flatMap((r) => [r.source, normalize(r.title)]).filter(Boolean));
      recipes.push(...jow.slice(done).filter((r) => !known.has(r.source) && !known.has(normalize(r.title))));
      localStorage.setItem(JOW_IMPORT_KEY, String(jow.length));
    }
    saveRecipes(true);
  } catch (e) {
    // Stockage indisponible (navigation privée stricte…) : on travaille en mémoire
    recipes = expandJowRecipes();
  }
}
function saveRecipes(silent = false) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
    return true;
  } catch (e) {
    if (!silent) showToast('Enregistrement impossible : l’espace de stockage du téléphone est plein ou bloqué.', 'error');
    return false;
  }
}

/** Ajoute ou met à jour une recette depuis le formulaire */
function addRecipe() {
  const title = $('#f-title').value.trim();
  if (!title) {
    $('#field-title').classList.add('is-invalid');
    $('#title-error').hidden = false;
    $('#f-title').focus();
    $('#field-title').scrollIntoView({ block: 'center', behavior: 'smooth' });
    haptic(30);
    showToast('Le titre est obligatoire', 'error');
    return false;
  }
  const rawTime = parseFloat(String($('#f-time').value).replace(',', '.'));
  const unit = $('input[name="unit"]:checked').value;
  const image = $('#f-image').value.trim();
  const source = $('#f-source').value.trim();
  const data = {
    title,
    image: isValidUrl(image) ? image : '',
    category: ($('input[name="category"]:checked') || {}).value || 'Plat',
    minutes: isNaN(rawTime) || rawTime < 0 ? 0 : Math.round(unit === 'h' ? rawTime * 60 : rawTime),
    servings: parseInt($('#f-servings').value, 10) || null,
    source: isValidUrl(source) ? source : '',
    seasons: $$('input[name="season"]:checked').map((i) => i.value),
    ingredients: toLines($('#f-ingredients').value),
    steps: toLines($('#f-steps').value)
  };

  if (editingId) {
    const id = editingId;
    recipes = recipes.map((r) => (r.id === id ? { ...r, ...data } : r));
    saveRecipes();
    renderRecipes();
    showToast('✅ Recette modifiée');
    viewRecipe(id, $('#form-sheet'));
  } else {
    recipes.unshift({ id: uid(), createdAt: Date.now(), ...data });
    saveRecipes();
    resetFilters();
    closeLayer($('#form-sheet'));
    renderRecipes();
    showToast('✅ Recette ajoutée');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  return true;
}

/** Supprime une recette. confirm=false quand le geste (swipe) vaut confirmation : annulation possible. */
async function deleteRecipe(id, { confirm = true } = {}) {
  const index = recipes.findIndex((r) => r.id === id);
  if (index < 0) return false;
  const recipe = recipes[index];
  if (confirm) {
    const choice = await openActionSheet({
      title: 'Supprimer cette recette ?',
      message: `« ${recipe.title} » sera retirée de votre carnet.`,
      actions: [{ key: 'delete', label: '🗑️ Supprimer', danger: true }]
    });
    if (choice !== 'delete') return false;
  }
  recipes.splice(index, 1);
  saveRecipes();
  if (viewingId === id) closeLayer($('#detail-sheet'));
  renderRecipes();
  haptic(20);
  showToast('Recette supprimée', 'success', {
    action: 'Annuler',
    onAction: () => {
      recipes.splice(Math.min(index, recipes.length), 0, recipe);
      saveRecipes();
      renderRecipes();
      showToast('↩️ Recette restaurée');
    }
  });
  return true;
}

/** Recettes après recherche + filtres */
function filteredRecipes() {
  return searchRecipes(filters.query).filter((r) =>
    (!filters.season || recipeSeasons(r).includes(filters.season)) &&
    (!filters.category || r.category === filters.category) &&
    (!filters.maxTime || (r.minutes > 0 && r.minutes <= filters.maxTime))
  );
}

/** Recherche par titre ou ingrédients, insensible aux accents */
function searchRecipes(query) {
  const terms = normalize(query).trim().split(/\s+/).filter(Boolean);
  if (!terms.length) return recipes.slice();
  return recipes.filter((r) => {
    const hay = normalize(r.title + ' ' + r.ingredients.join(' '));
    return terms.every((t) => hay.includes(t));
  });
}

/** Affiche la grille (2 colonnes équilibrées) */
function renderRecipes() {
  const grid = $('#grid');
  const empty = $('#empty');
  const list = filteredRecipes();
  renderSeasonBar();
  renderSummary(list.length);
  const active = activeFilterCount();
  $('#filter-badge').hidden = !active;
  $('#filter-badge').textContent = active;
  $('#filter-count').textContent = `${list.length} recette${list.length > 1 ? 's' : ''} correspond${list.length > 1 ? 'ent' : ''}`;
  $('#filter-apply').textContent = `Voir ${list.length} recette${list.length > 1 ? 's' : ''}`;
  grid.removeAttribute('aria-busy');

  if (!list.length) {
    grid.hidden = true;
    grid.innerHTML = '';
    empty.hidden = false;
    empty.innerHTML = recipes.length
      ? `<div class="empty-illu" aria-hidden="true"><span>🧂</span><span>🥕</span>🔍</div>
         <h2>Aucune recette trouvée</h2>
         <p>Rien ne correspond à cette recherche ou à ces filtres.</p>
         <button class="btn btn-primary" type="button" data-reset>Effacer les filtres</button>`
      : `<div class="empty-illu" aria-hidden="true"><span>🥄</span><span>🌿</span>🍽️</div>
         <h2>Votre carnet est vide</h2>
         <p>Ajoutez votre première recette. Elle reste enregistrée sur ce téléphone, même hors connexion.</p>
         <button class="btn btn-primary" type="button" data-add>＋ Ajouter une recette</button>`;
    return;
  }

  empty.hidden = true;
  grid.hidden = false;
  const cols = [[], []];
  const heights = [0, 0];
  list.forEach((r, i) => {
    const ratio = RATIOS[hash(r.id) % 2];
    const c = heights[0] <= heights[1] ? 0 : 1;
    heights[c] += (ratio === '3 / 4' ? 1.33 : 1.25) + Math.ceil(r.title.length / 16) * 0.14 + 0.5;
    cols[c].push(cardHTML(r, ratio, i < 4));
  });
  grid.innerHTML = cols.map((c) => `<div class="col">${c.join('')}</div>`).join('');
  // images déjà en cache : affichage immédiat, sans fondu
  $$('img', grid).forEach((img) => { if (img.complete && img.naturalWidth) img.parentElement.classList.add('is-loaded'); });
  updateSelectionUI();
}

function cardHTML(r, ratio, eager) {
  const cat = CATEGORIES[r.category] || CATEGORIES.Plat;
  const seasons = recipeSeasons(r);
  const seasonTxt = seasons.length === 4 ? '' : seasons.map((s) => SEASONS[s].emoji).join('');
  const label = `${r.title}, ${cat.label}, ${formatTime(r.minutes)}`;
  return `<article class="card${shopping.selected.includes(r.id) ? ' is-selected' : ''}" data-id="${esc(r.id)}">
    <div class="swipe-hint" aria-hidden="true">🗑️ Supprimer</div>
    <div class="card-inner" role="button" tabindex="0" aria-label="${esc(label)}">
      ${mediaHTML(r, { ratio, eager })}
      <div class="card-body">
        <h3 class="card-title">${esc(r.title)}</h3>
        <div class="meta"><span class="badge" data-cat="${esc(r.category)}">${cat.emoji} ${esc(cat.label)}</span><span class="time">⏱️ ${formatTime(r.minutes)}</span>${seasonTxt ? `<span aria-hidden="true">${seasonTxt}</span>` : ''}</div>
      </div>
    </div>
    <button class="select-btn" type="button" aria-pressed="${shopping.selected.includes(r.id)}" aria-label="Liste de courses : ${esc(r.title)}"><span class="circle" aria-hidden="true"><span class="tick">✓</span></span></button>
  </article>`;
}

/** Ouvre la fiche détaillée (from = écran à remplacer, ex. formulaire) */
function viewRecipe(id, from = null) {
  const r = recipes.find((x) => x.id === id);
  if (!r) return;
  viewingId = id;
  const cat = CATEGORIES[r.category] || CATEGORIES.Plat;
  const seasons = recipeSeasons(r);
  const ing = r.ingredients.length
    ? `<ul class="ing-list">${r.ingredients.map((x) => `<li><label class="ing"><input type="checkbox"><span>${esc(x)}</span></label></li>`).join('')}</ul>`
    : '<p class="muted-note">Aucun ingrédient renseigné.</p>';
  const steps = r.steps.length
    ? `<ol class="steps">${r.steps.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>`
    : '<p class="muted-note">Aucune étape renseignée.</p>';
  let sourceHost = '';
  try { sourceHost = r.source ? new URL(r.source).hostname.replace(/^www\./, '') : ''; } catch (e) { sourceHost = ''; }

  $('#detail-body').innerHTML = `
    <div class="hero-wrap">
      ${mediaHTML(r, { className: 'hero', eager: true })}
      <button class="icon-btn hero-close" type="button" data-close aria-label="Fermer">✕</button>
    </div>
    <div class="detail-content">
      <h2 id="detail-title" tabindex="-1">${esc(r.title)}</h2>
      <div class="meta">
        <span class="badge" data-cat="${esc(r.category)}">${cat.emoji} ${esc(cat.label)}</span>
        <span class="time">⏱️ ${formatTime(r.minutes)}</span>
        ${r.servings ? `<span>👥 ${r.servings} pers.</span>` : ''}
      </div>
      <button class="btn btn-soft detail-shop" type="button" id="detail-shop" aria-pressed="${shopping.selected.includes(r.id)}">${shopping.selected.includes(r.id) ? '✓ Dans la liste de courses' : '🛒 Ajouter à la liste de courses'}</button>
      <p class="detail-seasons">${seasons.length === 4 ? '🗓️ Toute l’année' : seasons.map((s) => `${SEASONS[s].emoji} ${SEASONS[s].label}`).join(' · ')}</p>
      <section class="section"><h3>🧺 Ingrédients</h3>${ing}</section>
      <section class="section"><h3>👩‍🍳 Étapes</h3>${steps}</section>
      ${sourceHost ? `<a class="btn btn-soft source-link" href="${esc(r.source)}" target="_blank" rel="noopener noreferrer">🔗 Recette complète sur ${esc(sourceHost)}</a>` : ''}
    </div>`;
  $('#detail-body').scrollTop = 0;
  from ? swapLayer(from, $('#detail-sheet')) : openLayer($('#detail-sheet'));
}

/** Supprime toutes les recettes (confirmation) */
async function clearAllRecipes() {
  if (!recipes.length) return false;
  const choice = await openActionSheet({
    title: 'Tout effacer ?',
    message: `Vos ${recipes.length} recettes seront supprimées de ce téléphone. Action irréversible.`,
    actions: [{ key: 'clear', label: '🧹 Tout effacer', danger: true }]
  });
  if (choice !== 'clear') return false;
  recipes = [];
  saveRecipes();
  clearSelection();
  resetFilters();
  renderRecipes();
  showToast('Toutes les recettes ont été supprimées');
  return true;
}

function activeFilterCount() {
  return (filters.season ? 1 : 0) + (filters.category ? 1 : 0) + (filters.maxTime ? 1 : 0);
}
function resetFilters() {
  Object.assign(filters, { query: '', season: '', category: '', maxTime: 0 });
  $('#search-input').value = '';
  closeSearch();
  renderFilterOptions();
}
function renderSeasonBar() {
  const now = currentSeason();
  $('#season-bar').innerHTML = SEASON_KEYS.map((k) => `
    <button class="season-btn" type="button" data-season="${k}" aria-pressed="${filters.season === k}"
      aria-label="${SEASONS[k].label}${k === now ? ', saison en cours' : ''}">
      <span class="emo" aria-hidden="true">${SEASONS[k].emoji}</span>${SEASONS[k].label}
      ${k === now ? '<span class="now-dot" aria-hidden="true"></span>' : ''}
    </button>`).join('');
}
function renderSummary(count) {
  const pills = [];
  if (filters.query) pills.push(['query', `🔍 ${filters.query}`]);
  if (filters.season) pills.push(['season', `${SEASONS[filters.season].emoji} ${SEASONS[filters.season].label}`]);
  if (filters.category) pills.push(['category', `${CATEGORIES[filters.category].emoji} ${CATEGORIES[filters.category].label}`]);
  if (filters.maxTime) pills.push(['maxTime', `⏱️ ≤ ${filters.maxTime} min`]);
  $('#summary').innerHTML = `<p class="count">${count} recette${count > 1 ? 's' : ''}</p>` +
    pills.map(([k, l]) => `<button class="pill" type="button" data-clear="${k}" aria-label="Retirer le filtre ${esc(l)}">${esc(l)} ✕</button>`).join('');
}
function renderFilterOptions() {
  const opt = (name, value, label, checked, extra = '') =>
    `<label class="opt ${extra}"><input type="radio" name="${name}" value="${value}" ${checked ? 'checked' : ''}><span>${esc(label)}</span></label>`;
  $('#flt-seasons').innerHTML = opt('flt-season', '', 'Toutes', !filters.season) +
    SEASON_KEYS.map((k) => opt('flt-season', k, `${SEASONS[k].emoji} ${SEASONS[k].label}`, filters.season === k)).join('');
  $('#flt-categories').innerHTML = opt('flt-category', '', 'Toutes', !filters.category) +
    Object.entries(CATEGORIES).map(([k, c]) => opt('flt-category', k, `${c.emoji} ${c.label}`, filters.category === k)).join('');
  $('#flt-times').innerHTML = TIME_FILTERS.map(([v, l]) => opt('flt-time', v, l, filters.maxTime === v)).join('');
}

/* =====================================================================
   ÉCRANS & HISTORIQUE (le bouton retour Android ferme l'écran ouvert)
   ===================================================================== */
const layers = [];
let historyEntry = false;
let ignorePop = false;
const lastFocus = new Map();

function syncLayersState() {
  const open = layers.length > 0;
  document.documentElement.classList.toggle('is-locked', open);
  $('#app').inert = open;
  if (open) {
    layers.forEach((l, i) => { l.inert = i !== layers.length - 1; });
    if (!historyEntry) {
      try { history.pushState({ recettesLayer: true }, ''); historyEntry = true; } catch (e) { /* historique indisponible */ }
    }
  } else if (historyEntry) {
    // différé : si un autre écran s'ouvre juste après (enchaînement), on garde l'entrée
    setTimeout(() => {
      if (!layers.length && historyEntry) {
        historyEntry = false;
        ignorePop = true;
        try { history.back(); } catch (e) { ignorePop = false; }
      }
    }, 0);
  }
}
function openLayer(el) {
  if (layers.includes(el)) return;
  lastFocus.set(el, document.activeElement);
  el.hidden = false;
  layers.push(el);
  syncLayersState();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.classList.add('is-open');
    const target = el.querySelector('[tabindex="-1"]');
    if (target) target.focus({ preventScroll: true });
  }));
}
function closeLayer(el, { restoreFocus = true } = {}) {
  const i = layers.indexOf(el);
  if (i < 0) return;
  layers.splice(i, 1);
  el.classList.remove('is-open');
  if (el.id === 'detail-sheet') viewingId = null;
  if (el.id === 'form-sheet') editingId = null;
  if (el._resolve) { el._resolve(el._choice ?? null); el._resolve = null; }
  setTimeout(() => { if (!layers.includes(el)) el.hidden = true; }, 300);
  syncLayersState();
  const f = lastFocus.get(el);
  if (restoreFocus && f && document.contains(f)) f.focus({ preventScroll: true });
}
function swapLayer(from, to) {
  closeLayer(from, { restoreFocus: false });
  openLayer(to);
}
window.addEventListener('popstate', () => {
  if (ignorePop) { ignorePop = false; return; }
  historyEntry = false;
  const top = layers[layers.length - 1];
  if (top) closeLayer(top);
});

/** Action sheet générique → Promise(clé choisie ou null) */
function openActionSheet({ title, message = '', actions }) {
  const el = $('#action-sheet');
  if (layers.includes(el)) closeLayer(el);
  $('#action-title').textContent = title;
  $('#action-msg').textContent = message;
  $('#action-msg').hidden = !message;
  $('#action-buttons').innerHTML = actions.map((a) =>
    `<button class="action-btn${a.danger ? ' is-danger' : ''}" type="button" data-key="${esc(a.key)}">${esc(a.label)}</button>`).join('');
  return new Promise((resolve) => {
    el._choice = null;
    el._resolve = resolve;
    openLayer(el);
  });
}

function openForm(id = null, from = null) {
  const form = $('#recipe-form');
  form.reset();
  $('#field-title').classList.remove('is-invalid');
  $('#title-error').hidden = true;
  const r = id ? recipes.find((x) => x.id === id) : null;
  $('#form-title').textContent = r ? 'Modifier la recette' : 'Nouvelle recette';
  $('#f-categories').innerHTML = Object.entries(CATEGORIES).map(([k, c]) =>
    `<label class="opt"><input type="radio" name="category" value="${k}" ${(r ? r.category : 'Plat') === k ? 'checked' : ''}><span>${c.emoji} ${c.label}</span></label>`).join('');
  $('#f-seasons').innerHTML = SEASON_KEYS.map((k) =>
    `<label class="opt season"><input type="checkbox" name="season" value="${k}" ${r && (r.seasons || []).includes(k) ? 'checked' : ''}><span>${SEASONS[k].emoji} ${SEASONS[k].label}</span></label>`).join('');
  if (r) {
    $('#f-title').value = r.title;
    $('#f-image').value = r.image || '';
    const hours = r.minutes >= 60 && r.minutes % 60 === 0;
    $('#f-time').value = r.minutes ? (hours ? r.minutes / 60 : r.minutes) : '';
    $(`input[name="unit"][value="${hours ? 'h' : 'min'}"]`).checked = true;
    $('#f-servings').value = r.servings || 2;
    $('#f-ingredients').value = r.ingredients.join('\n');
    $('#f-steps').value = r.steps.join('\n');
    $('#f-source').value = r.source || '';
  }
  checkPhoto();
  form.scrollTop = 0;
  from ? swapLayer(from, $('#form-sheet')) : openLayer($('#form-sheet'));
  editingId = r ? r.id : null;
}

// Vérification de l'image en direct, avec message clair en cas d'erreur
let photoTimer = null;
let photoToken = 0;
function checkPhoto() {
  clearTimeout(photoTimer);
  const url = $('#f-image').value.trim();
  const status = $('#photo-status');
  const preview = $('#photo-preview');
  const set = (text, cls = '') => { status.textContent = text; status.className = `field-status ${cls}`; };
  const token = ++photoToken;
  if (!url) { preview.textContent = '🖼️'; return set('Collez le lien d’une image (.jpg, .png, .webp).'); }
  if (!/^https?:\/\//i.test(url) || !isValidUrl(url)) { preview.textContent = '⚠️'; return set('Lien invalide : il doit commencer par https://', 'is-error'); }
  set('⏳ Vérification de l’image…');
  photoTimer = setTimeout(() => {
    const test = new Image();
    test.onload = () => {
      if (token !== photoToken) return;
      preview.innerHTML = '';
      preview.appendChild(test);
      set('✅ Image trouvée', 'is-ok');
    };
    test.onerror = () => {
      if (token !== photoToken) return;
      preview.textContent = '⚠️';
      set('Impossible d’afficher cette image. Vérifiez le lien ; sinon un visuel coloré la remplacera.', 'is-error');
    };
    test.src = url;
  }, 400);
}
