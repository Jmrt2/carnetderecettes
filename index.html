   TOASTS
   ===================================================================== */
function showToast(message, type = 'success', { action = '', onAction = null, duration = 0 } = {}) {
  const box = $('#toasts');
  while (box.children.length >= 2) box.firstChild.remove();
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.setAttribute('role', type === 'error' ? 'alert' : 'status');
  t.innerHTML = `<span></span>${action ? `<button type="button">${esc(action)}</button>` : ''}`;
  t.firstChild.textContent = message;
  const remove = () => { t.classList.add('is-leaving'); setTimeout(() => t.remove(), 200); };
  if (action) t.querySelector('button').addEventListener('click', () => { remove(); onAction && onAction(); });
  box.appendChild(t);
  setTimeout(remove, duration || (action ? 5000 : 2600));
}

/* =====================================================================
   GESTES SUR LES CARTES : tap = ouvrir, appui long = menu, swipe gauche = supprimer
   ===================================================================== */
function bindCardGestures() {
  const grid = $('#grid');
  let g = null;
  let suppressClick = false;

  const reset = () => {
    if (!g) return;
    clearTimeout(g.timer);
    g.card.classList.remove('is-swiping', 'is-armed');
    g.inner.style.transform = '';
    g = null;
  };

  grid.addEventListener('pointerdown', (e) => {
    const inner = e.target.closest('.card-inner');
    const card = inner && inner.closest('.card:not(.skeleton)');
    if (!card || (e.pointerType === 'mouse' && e.button !== 0) || e.target.closest('.select-btn')) return;
    suppressClick = false;
    g = { card, inner, id: card.dataset.id, x: e.clientX, y: e.clientY, mode: null, pid: e.pointerId };
    g.timer = setTimeout(() => {
      if (!g || g.mode) return;
      g.mode = 'long';
      suppressClick = true;
      haptic(15);
      showCardMenu(g.id);
      reset();
    }, 480);
  });

  grid.addEventListener('pointermove', (e) => {
    if (!g || e.pointerId !== g.pid) return;
    const dx = e.clientX - g.x;
    const dy = e.clientY - g.y;
    if (!g.mode) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      clearTimeout(g.timer);
      if (dx < 0 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        g.mode = 'swipe';
        g.card.classList.add('is-swiping');
        try { g.inner.setPointerCapture(g.pid); } catch (err) { /* ignore */ }
      } else {
        g.mode = 'scroll';
        return;
      }
    }
    if (g.mode === 'swipe') {
      const x = Math.min(0, dx);
      g.inner.style.transform = `translateX(${x}px)`;
      const armed = -x > g.card.offsetWidth * 0.45;
      if (armed && !g.card.classList.contains('is-armed')) haptic(8);
      g.card.classList.toggle('is-armed', armed);
    }
  });

  const end = (e) => {
    if (!g || e.pointerId !== g.pid) return;
    clearTimeout(g.timer);
    if (g.mode === 'swipe') {
      suppressClick = true;
      if (g.card.classList.contains('is-armed') && e.type === 'pointerup') {
        const { inner, id, card } = g;
        card.classList.replace('is-swiping', 'is-removing');
        inner.style.transform = 'translateX(-110%)';
        g = null;
        setTimeout(() => deleteRecipe(id, { confirm: false }), 200);
        return;
      }
    }
    reset();
  };
  grid.addEventListener('pointerup', end);
  grid.addEventListener('pointercancel', end);
  grid.addEventListener('contextmenu', (e) => { if (e.target.closest('.card')) e.preventDefault(); });

  grid.addEventListener('click', (e) => {
    const sel = e.target.closest('.select-btn');
    if (sel) {
      const added = toggleRecipeSelection(sel.closest('.card').dataset.id);
      if (added && shopping.selected.length === 1) showToast('🛒 Liste de courses créée : touchez la barre verte en bas');
      return;
    }
    const inner = e.target.closest('.card-inner');
    if (!inner || inner.closest('.skeleton')) return;
    if (suppressClick) { suppressClick = false; return; }
    viewRecipe(inner.closest('.card').dataset.id);
  });
  grid.addEventListener('keydown', (e) => {
    const inner = e.target.closest('.card-inner');
    if (!inner) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); viewRecipe(inner.closest('.card').dataset.id); }
    if (e.key === 'Delete' || e.key === 'Backspace') deleteRecipe(inner.closest('.card').dataset.id);
  });
}

async function showCardMenu(id) {
  const r = recipes.find((x) => x.id === id);
  if (!r) return;
  const choice = await openActionSheet({
    title: r.title,
    actions: [
      { key: 'view', label: '👁️ Voir la recette' },
      { key: 'shop', label: shopping.selected.includes(id) ? '✓ Retirer de la liste de courses' : '🛒 Ajouter à la liste de courses' },
      { key: 'edit', label: '✏️ Modifier' },
      { key: 'delete', label: '🗑️ Supprimer', danger: true }
    ]
  });
  if (choice === 'view') viewRecipe(id);
  if (choice === 'edit') openForm(id);
  if (choice === 'delete') deleteRecipe(id);
  if (choice === 'shop') toggleRecipeSelection(id);
}

/* =====================================================================
   LISTE DE COURSES
   ===================================================================== */
const SHOPPING_KEY = 'mesRecettes.shopping';
const TARGET_SERVINGS = 2;
// selected : ids des recettes cochées ; checked : articles achetés ; removed : articles retirés
let shopping = { selected: [], checked: [], removed: [] };

/* ---------- Analyse d'un ingrédient ---------- */
const FRACTIONS = { '½': 0.5, '¼': 0.25, '¾': 0.75, '⅓': 1 / 3, '⅔': 2 / 3, '⅛': 0.125 };
// [expression, unité normalisée, facteur de conversion]
const UNIT_RULES = [
  [/^(?:kg|kilos?|kilogrammes?)\b\.?/i, 'g', 1000],
  [/^(?:mg|milligrammes?)\b\.?/i, 'g', 0.001],
  [/^(?:g|gr|grs|grammes?)(?![a-zà-ÿ])\.?/i, 'g', 1],
  [/^(?:ml|millilitres?)\b\.?/i, 'ml', 1],
  [/^(?:cl|centilitres?)\b\.?/i, 'ml', 10],
  [/^(?:dl|décilitres?|decilitres?)\b\.?/i, 'ml', 100],
  [/^(?:l|litres?)(?![a-zà-ÿ'’])\.?/i, 'ml', 1000],
  [/^(?:c\.?\s*à\s*s\.?|càs|cas|cs|cuill?[eè]res?\s+à\s+soupe|cuil\.?\s+à\s+soupe|c\.\s*à\s*soupe)(?![a-zà-ÿ])/i, 'c. à s.', 1],
  [/^(?:c\.?\s*à\s*c\.?|càc|cac|cc|cuill?[eè]res?\s+à\s+café|cuil\.?\s+à\s+café|c\.\s*à\s*café)(?![a-zà-ÿ])/i, 'c. à c.', 1],
  [/^pinc[ée]es?\b\.?/i, 'pincée', 1],
  [/^gousses?\b/i, 'gousse', 1],
  [/^tranches?\b/i, 'tranche', 1],
  [/^bottes?\b/i, 'botte', 1],
  [/^poign[ée]es?\b/i, 'poignée', 1],
  [/^brins?\b/i, 'brin', 1],
  [/^quartiers?\b/i, 'quartier', 1],
  [/^sachets?\b/i, 'sachet', 1],
  [/^bo[iî]tes?\b/i, 'boîte', 1],
  [/^pots?\b/i, 'pot', 1],
  [/^feuilles?\b/i, 'feuille', 1],
  [/^tasses?\b/i, 'tasse', 1],
  [/^verres?\b/i, 'verre', 1],
  [/^cm\b/i, 'cm', 1],
  [/^(?:pi[èe]ces?|pcs?)\b\.?/i, '', 1]
];

function parseNumber(txt) {
  const t = txt.trim();
  let m = /^(\d+)\s+(\d+)\/(\d+)$/.exec(t);                 // 1 1/2
  if (m) return +m[1] + m[2] / m[3];
  m = /^(\d+)\/(\d+)$/.exec(t);                             // 1/2
  if (m) return m[1] / m[2];
  m = /^(\d+(?:[.,]\d+)?)?\s*([½¼¾⅓⅔⅛])?$/.exec(t);         // 2 | 3,5 | 1½ | ½
  if (m && (m[1] || m[2])) return (m[1] ? parseFloat(m[1].replace(',', '.')) : 0) + (m[2] ? FRACTIONS[m[2]] : 0);
  return null;
}

/** "200g farine" → { qty: 200, unit: "g", name: "farine" } (qty null si aucune quantité) */
function parseIngredient(ingredientText) {
  let text = String(ingredientText || '').replace(/\s+/g, ' ').trim();
  let name = text;
  let qtyPart = text;
  // Format des recettes Jow : "Oignon jaune · 700 g"
  const dot = text.lastIndexOf(' · ');
  if (dot > 0) { name = text.slice(0, dot); qtyPart = text.slice(dot + 3); }

  const m = /^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?\s*[½¼¾⅓⅔⅛]?|[½¼¾⅓⅔⅛])\s*/.exec(qtyPart);
  if (!m) return { qty: null, unit: '', name: text };
  let qty = parseNumber(m[1]);
  let rest = qtyPart.slice(m[0].length).replace(/^x\s*/i, '');
  let unit = '';
  for (const [re, u, factor] of UNIT_RULES) {
    const um = re.exec(rest);
    if (um) { unit = u; qty *= factor; rest = rest.slice(um[0].length).trim(); break; }
  }
  if (dot < 0) name = rest.replace(/^(?:de\s+|d['’]\s*)/i, '').trim() || text;
  return { qty: qty > 0 ? qty : null, unit, name };
}

/* ---------- Calcul pour 2 personnes ---------- */
function calculateIngredientsForTwo(ingredients, originalServings) {
  const servings = Number(originalServings) > 0 ? Number(originalServings) : TARGET_SERVINGS;
  const factor = TARGET_SERVINGS / servings;
  return (ingredients || []).map((line) => {
    const p = parseIngredient(line);
    return { ...p, qty: p.qty === null ? null : p.qty * factor };
  });
}

/* ---------- Fusion des ingrédients identiques ---------- */
function ingredientKey(name) {
  return normalize(String(name).replace(/œ/gi, 'oe').replace(/æ/gi, 'ae'))
    .replace(/[^a-z0-9()\s]/g, ' ')
    .split(/\s+/).filter(Boolean)
    .map((w) => (w.length > 3 ? w.replace(/(?:s|x)$/, '') : w))
    .join(' ');
}
function mergeIngredients(allIngredients) {
  const map = new Map();
  allIngredients.forEach(({ qty, unit, name, recipe }) => {
    const key = ingredientKey(name);
    if (!key) return;
    if (!map.has(key)) map.set(key, { key, name, amounts: new Map(), recipes: new Set() });
    const item = map.get(key);
    if (recipe) item.recipes.add(recipe);
    if (qty !== null) item.amounts.set(unit, (item.amounts.get(unit) || 0) + qty);
  });
  return [...map.values()].sort((a, b) => a.key.localeCompare(b.key, 'fr'));
}

/* ---------- Affichage des quantités ---------- */
function fractionText(v) {
  const q = Math.max(0.25, Math.round(v * 4) / 4);
  const whole = Math.floor(q);
  const frac = { 0.25: '¼', 0.5: '½', 0.75: '¾' }[+(q - whole).toFixed(2)] || '';
  return whole ? `${whole}${frac ? ' ' + frac : ''}` : frac;
}
function decimalText(v, digits = 1) {
  return String(+v.toFixed(digits)).replace('.', ',');
}
const PLURAL_UNITS = ['pincée', 'gousse', 'tranche', 'botte', 'poignée', 'brin', 'quartier', 'sachet', 'boîte', 'pot', 'feuille', 'tasse', 'verre'];
// < 10 : une décimale ; ≥ 100 : arrondi à 5 près ; au-delà de 1000 : kg / l
const metricText = (q) => (q < 10 ? decimalText(q) : String(q >= 100 ? Math.round(q / 5) * 5 : Math.round(q)));
function amountText(qty, unit) {
  if (unit === 'g') return qty >= 1000 ? `${decimalText(qty / 1000)} kg` : `${metricText(qty)} g`;
  if (unit === 'ml') return qty >= 1000 ? `${decimalText(qty / 1000)} l` : `${metricText(qty)} ml`;
  if (unit === 'c. à s.' || unit === 'c. à c.') return `${fractionText(Math.round(qty * 2) / 2)} ${unit}`;
  if (unit === 'cm') return `${decimalText(qty)} cm`;
  // Articles vendus à l'unité : au moins 1 → arrondi à l'unité supérieure (3 tranches, pas 2 ¾)
  const countable = ['', 'tranche', 'gousse', 'sachet', 'boîte', 'pot', 'feuille', 'quartier', 'tasse', 'verre'].includes(unit);
  if (countable && qty >= 1) qty = Math.ceil(qty - 0.15);
  const n = fractionText(qty);
  if (!unit) return n;
  return `${n} ${PLURAL_UNITS.includes(unit) && qty > 1.1 ? unit + 's' : unit}`;
}
function lowerFirst(s) {
  return /^[A-ZÀ-ÖØ-ÞŒ][a-zà-ÿœ]/.test(s) ? s.charAt(0).toLowerCase() + s.slice(1) : s;
}
function pluralizeName(name) {
  return name.replace(/^([^\s(]+)/, (w) => (/[sxz]$/i.test(w) ? w : w + 's'));
}
/** Texte d'un article : "250 g farine", "5 œufs", "moutarde" */
function itemText(item) {
  const name = lowerFirst(item.name);
  if (!item.amounts.size) return name;
  const parts = [...item.amounts].map(([unit, qty]) => amountText(qty, unit));
  const onlyPieces = item.amounts.size === 1 && item.amounts.has('');
  const displayName = onlyPieces && item.amounts.get('') > 1.1 ? pluralizeName(name) : name;
  return `${parts.join(' + ')} ${displayName}`;
}

/* ---------- Sélection ---------- */
function selectedRecipes() {
  const ids = new Set(shopping.selected);
  return recipes.filter((r) => ids.has(r.id));
}
function toggleRecipeSelection(recipeId) {
  const i = shopping.selected.indexOf(recipeId);
  if (i >= 0) shopping.selected.splice(i, 1);
  else shopping.selected.push(recipeId);
  haptic(8);
  saveShoppingListState();
  updateSelectionUI();
  return i < 0;
}
function clearSelection() {
  shopping = { selected: [], checked: [], removed: [] };
  saveShoppingListState();
  updateSelectionUI();
}

/* ---------- Génération de la liste ---------- */
function generateShoppingList() {
  const all = [];
  selectedRecipes().forEach((r) => {
    calculateIngredientsForTwo(r.ingredients, r.servings).forEach((p) => all.push({ ...p, recipe: r.title }));
  });
  const removed = new Set(shopping.removed);
  const checked = new Set(shopping.checked);
  const items = mergeIngredients(all).map((it) => ({ ...it, text: itemText(it), bought: checked.has(it.key) }));
  return {
    visible: items.filter((it) => !removed.has(it.key)),
    removedCount: items.filter((it) => removed.has(it.key)).length
  };
}

function renderShoppingList() {
  const sel = selectedRecipes();
  const body = $('#shop-body');
  const count = $('#shop-progress');
  if (!sel.length) {
    count.textContent = '';
    body.innerHTML = `<div class="empty"><div class="empty-illu" aria-hidden="true"><span>🥕</span><span>🧀</span>🛒</div>
      <h2>Sélectionne des recettes pour voir ta liste de courses</h2>
      <p>Touche le cercle ◯ en haut à gauche d’une recette.</p>
      <button class="btn btn-primary" type="button" data-close>Choisir des recettes</button></div>`;
    return;
  }
  const { visible, removedCount } = generateShoppingList();
  const bought = visible.filter((i) => i.bought).length;
  count.textContent = `${bought}/${visible.length}`;
  const ordered = [...visible.filter((i) => !i.bought), ...visible.filter((i) => i.bought)];
  body.innerHTML = `
    <div class="shop-recipes" aria-label="Recettes sélectionnées">
      ${sel.map((r) => `<button class="pill shop-recipe" type="button" data-unselect="${esc(r.id)}" aria-label="Retirer ${esc(r.title)} de la liste">
        ${esc(r.title)} <small>${r.servings && r.servings !== TARGET_SERVINGS ? `${r.servings}→2 pers.` : '2 pers.'}</small> ✕</button>`).join('')}
    </div>
    <div class="shop-progress-bar" role="progressbar" aria-label="Articles achetés" aria-valuemin="0" aria-valuemax="${visible.length}" aria-valuenow="${bought}">
      <span style="width:${visible.length ? (bought / visible.length) * 100 : 0}%"></span>
    </div>
    <p class="shop-hint">👉 Glisser à droite : acheté<br>✋ Appui long : retirer</p>
    <ul class="shop-list">
      ${ordered.map((it) => `<li class="shop-row${it.bought ? ' is-bought' : ''}" data-key="${esc(it.key)}">
        <label class="shop-item">
          <input type="checkbox" ${it.bought ? 'checked' : ''}>
          <span class="shop-text"><span class="shop-name">${esc(it.text)}</span>
          <span class="shop-from">${esc([...it.recipes].join(', '))}</span></span>
        </label>
      </li>`).join('')}
    </ul>
    ${removedCount ? `<button class="btn btn-soft shop-restore" type="button" id="shop-restore">↩️ Réafficher ${removedCount} article${removedCount > 1 ? 's' : ''} retiré${removedCount > 1 ? 's' : ''}</button>` : ''}`;
}

/** Met à jour tout ce qui dépend de la sélection */
function updateSelectionUI() {
  const ids = new Set(shopping.selected);
  const n = selectedRecipes().length;
  $$('#grid .card[data-id]').forEach((card) => {
    const on = ids.has(card.dataset.id);
    card.classList.toggle('is-selected', on);
    const btn = card.querySelector('.select-btn');
    if (btn) btn.setAttribute('aria-pressed', on);
  });
  $('#sel-count').hidden = !n;
  $('#sel-count').textContent = `✓ ${n} sélectionnée${n > 1 ? 's' : ''}`;
  $('#sel-count').setAttribute('aria-label', `${n} recette${n > 1 ? 's' : ''} sélectionnée${n > 1 ? 's' : ''}`);
  document.documentElement.classList.toggle('has-cart', n > 0);
  $('#cart-bar').hidden = !n;
  if (n) {
    const { visible } = generateShoppingList();
    const left = visible.filter((i) => !i.bought).length;
    $('#cart-sub').textContent = `${n} recette${n > 1 ? 's' : ''} · ${left} article${left > 1 ? 's' : ''}`;
    $('#cart-open').setAttribute('aria-label', `Liste de courses : ${n} recette${n > 1 ? 's' : ''}, ${left} article${left > 1 ? 's' : ''} à acheter`);
  }
  const detailToggle = $('#detail-shop');
  if (detailToggle && viewingId) {
    const on = ids.has(viewingId);
    detailToggle.textContent = on ? '✓ Dans la liste de courses' : '🛒 Ajouter à la liste de courses';
    detailToggle.setAttribute('aria-pressed', on);
  }
  if (layers.includes($('#shop-sheet'))) renderShoppingList();
}

/* ---------- Copier / partager ---------- */
function shoppingText() {
  const { visible } = generateShoppingList();
  return [`🛒 Liste de courses (pour ${TARGET_SERVINGS} personnes)`, ...visible.map((i) => `${i.bought ? '[x]' : '[]'} ${i.text}`)].join('\n');
}
function copyWithTextarea(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
  document.body.appendChild(ta);
  ta.focus({ preventScroll: true });
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.blur();
  ta.remove();
  return ok;
}
async function copyShoppingList() {
  const text = shoppingText();
  // 1) copie synchrone, dans le geste (la plus fiable sur iOS Safari)
  let ok = copyWithTextarea(text);
  // 2) API presse-papier moderne
  if (!ok && navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = false; }
  }
  if (ok) { haptic(20); showToast('✅ Liste copiée !', 'success', { duration: 2000 }); return true; }
  // 3) Dernier recours : feuille de partage native (SMS, WhatsApp…)
  if (navigator.share) {
    try { await navigator.share({ title: 'Liste de courses', text }); return true; } catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  showToast('Copie impossible sur cet appareil. Réessayez ou faites une capture d’écran de la liste.', 'error');
  return false;
}

/* ---------- Sauvegarde ---------- */
function saveShoppingListState() {
  try { localStorage.setItem(SHOPPING_KEY, JSON.stringify(shopping)); } catch (e) { /* stockage indisponible : état en mémoire */ }
}
function loadShoppingListState() {
  try {
    const s = JSON.parse(localStorage.getItem(SHOPPING_KEY) || 'null');
    if (s && typeof s === 'object') {
      const arr = (v) => (Array.isArray(v) ? v.map(String) : []);
      shopping = { selected: arr(s.selected), checked: arr(s.checked), removed: arr(s.removed) };
    }
  } catch (e) { shopping = { selected: [], checked: [], removed: [] }; }
}

function setItemBought(key, bought) {
  shopping.checked = shopping.checked.filter((k) => k !== key);
  if (bought) shopping.checked.push(key);
  haptic(8);
  saveShoppingListState();
  updateSelectionUI();
}
function removeItem(key) {
  if (!shopping.removed.includes(key)) shopping.removed.push(key);
  haptic(15);
  saveShoppingListState();
  updateSelectionUI();
  showToast('Article retiré de la liste', 'success', {
    action: 'Annuler',
    onAction: () => { shopping.removed = shopping.removed.filter((k) => k !== key); saveShoppingListState(); updateSelectionUI(); }
  });
}

/* ---------- Événements de la liste (swipe droite = acheté, appui long = retirer) ---------- */
function bindShoppingEvents() {
  $('#cart-open').addEventListener('click', () => { renderShoppingList(); openLayer($('#shop-sheet')); });
  $('#shop-copy').addEventListener('click', copyShoppingList);
  $('#shop-copy-top').addEventListener('click', copyShoppingList);
  $('#shop-reset').addEventListener('click', () => {
    shopping.checked = [];
    shopping.removed = [];
    saveShoppingListState();
    updateSelectionUI();
    showToast('↺ Liste remise à zéro');
  });
  $('#shop-clear').addEventListener('click', async () => {
    const choice = await openActionSheet({
      title: 'Tout désélectionner ?',
      message: 'Les recettes seront retirées de la liste de courses (elles restent dans votre carnet).',
      actions: [{ key: 'clear', label: '✕ Tout désélectionner', danger: true }]
    });
    if (choice !== 'clear') return;
    clearSelection();
    closeLayer($('#shop-sheet'));
    showToast('Liste de courses vidée');
  });

  const body = $('#shop-body');
  body.addEventListener('click', (e) => {
    const un = e.target.closest('[data-unselect]');
    if (un) { toggleRecipeSelection(un.dataset.unselect); return; }
    if (e.target.closest('#shop-restore')) { shopping.removed = []; saveShoppingListState(); updateSelectionUI(); }
  });
  body.addEventListener('change', (e) => {
    const row = e.target.closest('.shop-row');
    if (row) setItemBought(row.dataset.key, e.target.checked);
  });

  let g = null;
  let suppress = false;
  const reset = () => { if (!g) return; clearTimeout(g.timer); g.row.style.transform = ''; g.row.classList.remove('is-swiping', 'is-armed'); g = null; };
  body.addEventListener('pointerdown', (e) => {
    const row = e.target.closest('.shop-row');
    if (!row) return;
    suppress = false;
    g = { row, key: row.dataset.key, x: e.clientX, y: e.clientY, mode: null, pid: e.pointerId };
    g.timer = setTimeout(() => {
      if (!g || g.mode) return;
      suppress = true;
      const key = g.key;
      reset();
      removeItem(key);
    }, 550);
  });
  body.addEventListener('pointermove', (e) => {
    if (!g || e.pointerId !== g.pid) return;
    const dx = e.clientX - g.x;
    const dy = e.clientY - g.y;
    if (!g.mode) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      clearTimeout(g.timer);
      if (dx > 0 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        g.mode = 'swipe';
        g.row.classList.add('is-swiping');
        try { g.row.setPointerCapture(g.pid); } catch (err) { /* ignore */ }
      } else { g.mode = 'scroll'; return; }
    }
    const x = Math.max(0, Math.min(dx, g.row.offsetWidth * 0.6));
    g.row.style.transform = `translateX(${x}px)`;
    g.row.classList.toggle('is-armed', x > g.row.offsetWidth * 0.3);
  });
  const end = (e) => {
    if (!g || e.pointerId !== g.pid) return;
    clearTimeout(g.timer);
    if (g.mode === 'swipe') {
      suppress = true;
      if (g.row.classList.contains('is-armed') && e.type === 'pointerup') {
        const key = g.key;
        const bought = !g.row.classList.contains('is-bought');
        reset();
        setItemBought(key, bought);
        return;
      }
    }
    reset();
  };
  body.addEventListener('pointerup', end);
  body.addEventListener('pointercancel', end);
  body.addEventListener('contextmenu', (e) => { if (e.target.closest('.shop-row')) e.preventDefault(); });
  // Empêche le clic "fantôme" après un swipe ou un appui long de cocher la case
  body.addEventListener('click', (e) => {
    if (suppress && e.target.closest('.shop-row')) { e.preventDefault(); suppress = false; }
  }, true);
}

/* =====================================================================
   ÉVÉNEMENTS
   ===================================================================== */
function bindEvents() {
  $('#fab').addEventListener('click', () => openForm());
  $('#btn-search').addEventListener('click', openSearch);
  $('#search-cancel').addEventListener('click', () => {
    filters.query = '';
    $('#search-input').value = '';
    closeSearch();
    renderRecipes();
  });
  let searchTimer = null;
  $('#search-input').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { filters.query = e.target.value.trim(); renderRecipes(); }, 120);
  });
  $('#search-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') e.target.blur(); });

  $('#btn-filters').addEventListener('click', () => { renderFilterOptions(); openLayer($('#filter-sheet')); });
  $('#btn-more').addEventListener('click', async () => {
    const choice = await openActionSheet({
      title: 'Gestes rapides',
      message: 'Appui long sur une recette : menu. Glisser une recette vers la gauche : supprimer (annulable).',
      actions: [{ key: 'clear', label: '🧹 Tout effacer', danger: true }]
    });
    if (choice === 'clear') clearAllRecipes();
  });

  $('#season-bar').addEventListener('click', (e) => {
    const b = e.target.closest('[data-season]');
    if (!b) return;
    filters.season = filters.season === b.dataset.season ? '' : b.dataset.season;
    haptic(5);
    renderRecipes();
  });
  $('#summary').addEventListener('click', (e) => {
    const b = e.target.closest('[data-clear]');
    if (!b) return;
    const k = b.dataset.clear;
    filters[k] = k === 'maxTime' ? 0 : '';
    if (k === 'query') { $('#search-input').value = ''; closeSearch(); }
    renderRecipes();
  });
  $('#empty').addEventListener('click', (e) => {
    if (e.target.closest('[data-add]')) openForm();
    if (e.target.closest('[data-reset]')) { resetFilters(); renderRecipes(); }
  });

  // Filtres : application immédiate
  $('#filter-sheet').addEventListener('change', (e) => {
    const { name, value } = e.target;
    if (name === 'flt-season') filters.season = value;
    if (name === 'flt-category') filters.category = value;
    if (name === 'flt-time') filters.maxTime = Number(value);
    renderRecipes();
  });
  $('#filter-reset').addEventListener('click', () => {
    Object.assign(filters, { season: '', category: '', maxTime: 0 });
    renderFilterOptions();
    renderRecipes();
  });

  // Formulaire
  $('#recipe-form').addEventListener('submit', (e) => { e.preventDefault(); addRecipe(); });
  $('#f-title').addEventListener('input', () => { $('#field-title').classList.remove('is-invalid'); $('#title-error').hidden = true; });
  $('#f-image').addEventListener('input', checkPhoto);
  const stepServings = (d) => { const i = $('#f-servings'); i.value = Math.min(30, Math.max(1, (parseInt(i.value, 10) || 2) + d)); haptic(5); };
  $('#servings-minus').addEventListener('click', () => stepServings(-1));
  $('#servings-plus').addEventListener('click', () => stepServings(1));

  // Détail
  $('#detail-edit').addEventListener('click', () => { const id = viewingId; if (id) openForm(id, $('#detail-sheet')); });
  $('#detail-delete').addEventListener('click', () => viewingId && deleteRecipe(viewingId));
  $('#detail-body').addEventListener('click', (e) => { if (e.target.closest('#detail-shop') && viewingId) toggleRecipeSelection(viewingId); });

  // Fermeture des écrans
  $$('.sheet').forEach((s) => s.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeLayer(s); }));
  $('#action-sheet').addEventListener('click', (e) => {
    const el = $('#action-sheet');
    const btn = e.target.closest('[data-key]');
    if (btn) { el._choice = btn.dataset.key; closeLayer(el); }
    else if (e.target.closest('[data-dismiss]')) closeLayer(el);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && layers.length) closeLayer(layers[layers.length - 1]);
  });

  // Pas de zoom par pincement (iOS ignore user-scalable=no)
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  // Synchronisation entre onglets
  window.addEventListener('storage', (e) => { if (e.key === STORAGE_KEY) { loadRecipes(); renderRecipes(); } });

  bindCardGestures();
  bindShoppingEvents();
}

/* =====================================================================
   PWA : icône + manifest générés à la volée (fichier unique)
   ===================================================================== */
function setupPwa() {
  try {
    const add = (rel, href, extra = {}) => {
      const l = document.createElement('link');
      Object.assign(l, { rel, href }, extra);
      document.head.appendChild(l);
    };
    add('apple-touch-icon', ICON);
    add('icon', ICON, { type: 'image/png' });
    const manifest = {
      name: 'Mes Recettes', short_name: 'Recettes', display: 'standalone', orientation: 'portrait',
      background_color: '#E7D9C8', theme_color: '#E7D9C8', start_url: location.href.split('#')[0],
      icons: [{ src: ICON, sizes: '180x180', type: 'image/png' }]
    };
    add('manifest', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest)));
  } catch (e) { /* optionnel */ }
}

/* =====================================================================
   GESTION D'ERREURS GLOBALE : l'app ne doit jamais rester bloquée
   ===================================================================== */
let lastErrorToast = 0;
function reportError(err) {
  console.error(err);
  if (Date.now() - lastErrorToast < 4000) return;
  lastErrorToast = Date.now();
  try { showToast('Un souci est survenu, mais vos recettes sont en sécurité.', 'error'); } catch (e) { /* rien */ }
}
window.addEventListener('error', (e) => { if (e.error) reportError(e.error); });
window.addEventListener('unhandledrejection', (e) => reportError(e.reason));

/* =====================================================================
   INITIALISATION
   ===================================================================== */
function init() {
  setupPwa();
  try {
    loadRecipes();
    loadShoppingListState();
    bindEvents();
    renderFilterOptions();
    renderRecipes();
  } catch (e) {
    reportError(e);
    $('#grid').hidden = true;
    $('#empty').hidden = false;
    $('#empty').innerHTML = '<div class="empty-illu" aria-hidden="true">🍳</div><h2>Chargement impossible</h2><p>Rechargez la page. Vos recettes restent enregistrées sur ce téléphone.</p><button class="btn btn-primary" type="button" onclick="location.reload()">Recharger</button>';
  }
}
init();
</script>
